# Bộ đánh giá hỏi đáp gói Seller (spec 09 §7). Chạy: `uv run python ai/run_evals.py seller`.
# expect.metrics: các chỉ số phải có trong chân trang; expect.time.preset: kỳ phải đúng;
# expect.numeric: số trong câu trả lời khớp gọi API trực tiếp trong sai số; refuse / missing_metric: phải từ chối / ghi nhận.

- id: seller_profit_last_week
  question: "Tuần trước lãi bao nhiêu?"
  tenant: demo_seller
  expect:
    metrics: [net_profit_after_fees]
    time: {preset: last_week}
    numeric: {metric: net_profit_after_fees, tolerance_pct: 0.5}
- id: seller_revenue_last_week
  question: "Doanh thu thực nhận tuần trước là bao nhiêu?"
  tenant: demo_seller
  expect:
    metrics: [net_revenue]
    time: {preset: last_week}
    numeric: {metric: net_revenue, tolerance_pct: 0.5}
