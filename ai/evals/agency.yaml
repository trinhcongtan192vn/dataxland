# Bộ đánh giá hỏi đáp gói Agency (spec 09 §7). Chạy: `uv run python ai/run_evals.py agency`.

- id: agency_spend_last_week
  question: "Tuần trước chi quảng cáo tổng bao nhiêu?"
  tenant: demo_agency
  expect:
    metrics: [ad_spend]
    time: {preset: last_week}
    numeric: {metric: ad_spend, tolerance_pct: 0.5}
