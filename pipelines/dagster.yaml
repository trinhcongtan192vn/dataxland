# Cấu hình instance Dagster (spec 04 §3.1). Lưu trạng thái trong database `dagster` của Postgres.
storage:
  postgres:
    postgres_url:
      env: DAGSTER_PG_URL

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # Toàn hệ thống tối đa 3 lần chạy đồng thời; mỗi khách 1 (spec 04 §3.1).
    max_concurrent_runs: 3
    tag_concurrency_limits:
      - key: "dx/tenant"
        value:
          applyLimitPerUniqueValue: true
        limit: 1

telemetry:
  enabled: false
