[project]
name = "dx-pipelines"
version = "0.1.0"
description = "pipelines – Dagster + dlt + dbt (spec 01, 04)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dx-common",
  "dagster>=1.9",
  "dagster-webserver>=1.9",
  "dagster-dbt>=0.25",
  "dagster-dlt>=0.25",
  "dlt[bigquery,duckdb,sql_database]>=1.4",
  "dbt-core>=1.9,<1.11",
  "dbt-duckdb>=1.9",
  "dbt-bigquery>=1.9",
  "duckdb>=1.1",
  "httpx>=0.28",
  "dx-identity-worker",
  "openpyxl>=3.1",
  "croniter>=5.0",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
gcp = ["google-cloud-bigquery>=3.27", "google-cloud-storage>=2.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dx_pipelines", "connectors"]
