# Nhận diện loại file theo tên cột tiêu đề (spec 07 §4.2). Mỗi nhóm là các tên chấp nhận được của một cột
# (tiếng Việt và tiếng Anh vì sàn đổi ngôn ngữ xuất theo cài đặt). Khớp khi tỷ lệ nhóm có mặt ≥ 80%.
shopee_orders:
  label_vi: Đơn hàng Shopee
  columns:
    - [Mã đơn hàng, Order ID]
    - [Ngày đặt hàng, Order Creation Date]
    - [Trạng Thái Đơn Hàng, Trạng thái đơn hàng, Order Status]
    - [SKU phân loại hàng, SKU Reference No., Variation SKU]
    - [Tên sản phẩm, Product Name]
    - [Giá gốc, Original Price]
    - [Giá ưu đãi, Deal Price]
    - [Số lượng, Quantity]
    - [Mã giảm giá của Shop, Seller Voucher]
    - [Mã giảm giá của Shopee, Shopee Voucher]
shopee_income:
  label_vi: Báo cáo doanh thu Shopee
  columns:
    - [Mã đơn hàng, Order ID]
    - [Ngày hoàn thành thanh toán, Payout Completed Date]
    - [Giá sản phẩm, Product Price]
    - [Phí cố định, Commission Fee]
    - [Phí Dịch Vụ, Phí dịch vụ, Service Fee]
    - [Phí thanh toán, Transaction Fee]
    - [Phí vận chuyển thực tế, Actual Shipping Fee]
    - [Phí vận chuyển được trợ giá từ Shopee, Shopee Shipping Rebate]
    - [Phí vận chuyển Người mua trả, Shipping Fee Paid by Buyer]
    - [Tổng tiền đã thanh toán, Total Released Amount]
tiktok_shop_orders:
  label_vi: Đơn hàng TikTok Shop
  columns:
    - [Order ID, Mã đơn hàng]
    - [Order Status, Trạng thái đơn hàng]
    - [Seller SKU, SKU người bán]
    - [Product Name, Tên sản phẩm]
    - [Quantity, Số lượng]
    - [SKU Unit Original Price, Giá gốc đơn vị SKU]
    - [SKU Seller Discount, Giảm giá của người bán]
    - [SKU Platform Discount, Giảm giá của nền tảng]
    - [Created Time, Thời gian tạo]
