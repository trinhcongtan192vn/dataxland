[project]
name = "dx-mcp"
version = "0.1.0"
description = "services/mcp – MCP server chỉ đọc chỉ số cho AI hỏi đáp (spec 09, GĐ2)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dx-common",
  "mcp>=1.2",
  "httpx>=0.28",
  "pyjwt>=2.10",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dx_mcp"]
