[project]
name = "dx-identity-worker"
version = "0.1.0"
description = "services/identity_worker – ghép định danh sản phẩm và người mua (spec 10, GĐ2)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dx-common",
  "rapidfuzz>=3.10",
  "anthropic>=0.40",
  "duckdb>=1.1",
  "httpx>=0.28",
]

[project.optional-dependencies]
gcp = ["google-cloud-bigquery>=3.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identity_worker"]
