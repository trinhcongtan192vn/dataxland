[project]
name = "dx-common"
version = "0.1.0"
description = "Thư viện Python dùng chung của DataxLand (spec 00 §1.1)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "python-ulid>=3.0",
  "croniter>=5.0",
]

[project.optional-dependencies]
gcp = ["google-cloud-secret-manager>=2.21", "google-cloud-storage>=2.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dx_common"]
