metric: returned_orders
name_vi: Số đơn hoàn
description_vi: Số đơn có hoàn hàng hoặc hoàn tiền.
version: 1.0.0
type: simple
hidden: true
source: mrt_seller__orders
measure:
  agg: count
  column: order_id
  filters:
