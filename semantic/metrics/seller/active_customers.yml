    op: eq
    value: order
  - column: is_cancelled
    op: eq
    value: false
dimensions:
- channel
- date
- platform
source_note_vi: Đơn trên các sàn, người mua đã gộp theo số điện thoại, email hoặc mã người mua.
unit: count
good_direction: up
packs:
- seller
requires:
- identity
time_grains:
- day
- week
- month
owner: data-lead
history:
- version: 1.0.0
  date: '2026-10-17'
  change_vi: Phiên bản đầu tiên (giai đoạn 2, spec 10 §7).
