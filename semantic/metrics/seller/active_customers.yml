metric: active_customers
name_vi: Số người mua có đơn
description_vi: Số người mua (sau khi gộp định danh) có ít nhất một đơn không hủy trong kỳ.
version: 1.0.0
type: simple
hidden: true
source: mrt_seller__orders
measure:
  agg: count_distinct
  column: customer_id
  filters:
